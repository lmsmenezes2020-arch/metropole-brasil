name: Importar interface original verificada
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/importar-interface.yml'
      - 'scripts/import-frontend.mjs'
      - 'scripts/frontend-shell.html'
permissions:
  contents: write
concurrency:
  group: importar-interface
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Importar somente código com integridade SHA-256 confirmada
        run: node scripts/import-frontend.mjs
      - name: Salvar arquivos completos no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/versao.json server/engine.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Importar interface e motor originais do Metrópole 4.0 com SHA-256 verificado'
          git pull --rebase origin main
          git push origin HEAD:main
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build ALB Coin V2
        working-directory: albcoin
        run: gradle assembleRelease
      - name: Validate APK
        working-directory: albcoin
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ALB-Coin-Online-V2-real-build
          path: albcoin/app/build/outputs/apk/release/app-release.apk
