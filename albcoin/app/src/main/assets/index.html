<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALB Coin Online</title><style>body{margin:0;font-family:Arial,sans-serif;background:#08111f;color:#fff}main{max-width:720px;margin:auto;padding:24px}h1{font-size:32px}.card{background:#111d2d;border:1px solid #24354d;border-radius:18px;padding:20px;margin:16px 0}input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #344b68;font-size:16px}button{background:#1f6feb;color:white;border:0;font-weight:bold}.coin{font-size:42px;font-weight:bold;color:#ffd54a}.ok{color:#7ee787}.err{color:#ff7b72}</style></head><body><main><h1>🪙 ALB Coin</h1><div class="card"><div>ALB Coin Online — V2</div><p>Aplicativo Android conectado à infraestrutura Supabase.</p><div id="status">Verificando conexão…</div></div><div class="card"><h2>Acesso</h2><input id="email" placeholder="E-mail" type="email"><input id="password" placeholder="Senha" type="password"><button onclick="login()">Entrar</button><div id="msg"></div></div><div class="card"><h2>Carteira</h2><div class="coin" id="saldo">0 ALB</div><p>Os dados da carteira serão carregados da conta autenticada.</p></div></main><script>const SUPABASE_URL='https://xldwflijjdbiovubhfsr.supabase.co';const SUPABASE_KEY='sb_publishable_Bn_s_0pKU7pC7n2CmVHZfw_241B0Fax';const status=document.getElementById('status');fetch(SUPABASE_URL+'/rest/v1/',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}}).then(r=>{status.textContent=r.ok?'Supabase conectado.':'Supabase respondeu, mas verifique o banco.';status.className=r.ok?'ok':'err'}).catch(()=>{status.textContent='Sem conexão com a internet.';status.className='err'});async function login(){const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const msg=document.getElementById('msg');if(!email||!password){msg.textContent='Informe e-mail e senha.';msg.className='err';return}try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Falha no login');localStorage.setItem('alb_access_token',d.access_token);msg.textContent='Login realizado com sucesso.';msg.className='ok';await loadProfile(d.access_token)}catch(e){msg.textContent=e.message;msg.className='err'}}async function loadProfile(token){const r=await fetch(SUPABASE_URL+'/rest/v1/profiles?select=saldo_alb&limit=1',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});if(r.ok){const d=await r.json();if(d[0])document.getElementById('saldo').textContent=Number(d[0].saldo_alb||0).toLocaleString('pt-BR')+' ALB'}}</script></body></html>
