:root {

*{box-sizing:border-box}
html{min-width:280px;scroll-padding-top:16px}

function shuffled(values,rng=randomInt){
  const a=values.slice();for(let i=a.length-1;i>0;i--){const j=rng(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;
}
function draw(s,rng){
  if(!s.deck.length){s.deck=shuffled(s.discard,rng);s.discard=[];}
  const index=s.deck.shift();check(CARDS[index],'O baralho está indisponível.');
  if(!CARDS[index].pass)s.discard.push(index);
  return {...CARDS[index],cardId:index};
}
function returnPass(s,p){
  if(p.passes){s.discard.push(CARDS.findIndex(c=>c.pass));p.passes--;}
}

function id(){return Array.from({length:24},()=>randomInt(16).toString(16)).join('');}
function code(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>chars[randomInt(chars.length)]).join('');}
function check(condition,msg){if(!condition)throw new Error(msg);}
function name(v){const n=String(v||'').replace(/[\x00-\x1F\x7F]/g,'').trim().slice(0,18);check(n.length>0,'Digite seu nome.');return n;}

function setOnline(state,pid,status,now=Date.now()){

function join(state,n,pid=id(),bot=false){

function activeLoans(s){return (s.loans||[]).filter(l=>['active','overdue'].includes(l.status)&&l.balance>0);}

function lien(s,tid){return activeLoans(s).find(l=>l.collateralId===tid&&s.properties[tid]?.owner===l.borrowerId);}
function assetValue(s,tid){const t=TILES[tid],d=s.properties[tid];if(!t?.price||!d)return 0;return t.price+(t.group?d.level*GROUPS[t.group].build:0)-(d.mortgaged?Math.floor(t.price/2):0);}

function spendable(s,pid){
 let free=legacySpendable(s,pid);

function buildReason(s,pid,tid){

function loanTotal(principal,rate){return Math.ceil(principal*(100+rate)/100);}

function validateCredit(s,tr,ignoreOffer=false){

function createLoan(s,tr,now){

 s.loans.push(l);s.loanOffer=null;
 log(s,`${b.name} recebeu ${cashfmt(l.principal)} de ${l.lenderId?player(s,l.lenderId).name:'Banco Metrópole'}. Total: ${cashfmt(total)}; vencimento na sua vez da rodada ${l.dueRound}.`,'money',now);

function credit(s,pid,value){if(pid){const p=player(s,pid);if(!p.bankrupt&&!p.removed)p.cash+=value;}}
function closePaidLoan(s,l,now=Date.now()){

 log(s,`Empréstimo de ${player(s,l.borrowerId).name} quitado. A garantia está liberada.`,'success',now);

function completeDebt(s,rng=randomInt){
 const d=s.debt;if(!d||d.amount>0)return;
 const p=player(s,d.playerId),after=d.after,l=d.loanId?(s.loans||[]).find(x=>x.id===d.loanId):null;
 if(l)closePaidLoan(s,l);s.debt=null;s.assetOffer=null;s.turnState='end';
 log(s,`${p.name} quitou a dívida.`,'success');
 if(after?.kind==='jailMove'){p.jailRelease=false;move(s,p,after.steps);land(s,p,rng);}

function settle(s,p,rng=randomInt){

 completeDebt(s,rng);

function charge(s,p,v,creditorId=null,reason='Pagamento'){

function transferDebtAsset(s,tid,toBank=false,now=Date.now()){

function checkEmptyDefault(s){

function bankCollect(s){

// Size by BOTH screen width and available height, rather than by width alone.
// This does not hide overflowing cells or place the board in a scroll window.
let fitFrame=0;
function scheduleBoardFit(){
 cancelAnimationFrame(fitFrame);
 fitFrame=requestAnimationFrame(fitBoard);
}
function fitBoard(){
 const board=$('#board'),viewport=$('#boardViewport'),wrap=$('.gamegrid .board-wrap');
 if(!board||!viewport||!wrap)return;
 const focused=document.body.classList.contains('board-focus');
 const availableWidth=viewport.clientWidth;
 let size=availableWidth*boardScale;
 if(focused){
  const h=(window.visualViewport?.height||innerHeight)-120;
  size=Math.min(availableWidth,Math.max(200,h));
 }
 const resizing=Math.abs(board.getBoundingClientRect().width-Math.floor(size))>1;
 if(resizing)board.querySelectorAll('.pawn').forEach(e=>e.style.transition='none');
 board.style.setProperty('--board-fit',Math.floor(size)+'px');
 viewport.classList.toggle('magnified',boardScale>1&&!focused);
 const b=$('[data-ui="boardScale"]');if(b)b.textContent=boardScale===1?'Ampliar +':boardScale===1.5?'Zoom 150% +':'Reduzir −';
 if($('#boardHint'))$('#boardHint').textContent=boardScale>1&&!focused?'Arraste dentro do tabuleiro ampliado para ver todas as casas.':'Toque no terreno para ver nome completo, cidade e valores.';
 positionPawns();
 if(resizing){void board.offsetWidth;requestAnimationFrame(()=>board.querySelectorAll('.pawn').forEach(e=>e.style.transition=''));}
}

function toggleBoardFocus(force){
 if(!$('#board'))return;
 const on=typeof force==='boolean'?force:!document.body.classList.contains('board-focus');
 document.body.classList.toggle('board-focus',on);
 document.querySelectorAll('[data-ui="zoom"]').forEach(b=>{
  b.textContent=on?'Voltar ×':'Tela ampla ⛶';
  b.setAttribute('aria-pressed',String(on));
 });
 syncChatMode();scheduleBoardFit();
}
function positionPawns(){
 if(!S||!$('#pawns'))return;
 const layer=$('#pawns'),lr=layer.getBoundingClientRect();
 for(const p of S.players){
  const el=layer.querySelector(`[data-pawn="${p.id}"]`);
  const tile=$(`#board [data-tile="${p.pos}"]`);
  if(!el||!tile||p.bankrupt)continue;
  const r=tile.getBoundingClientRect();
  const peers=S.players.filter(x=>!x.bankrupt&&x.pos===p.pos),n=peers.findIndex(x=>x.id===p.id);
  const cols=Math.min(3,peers.length),rows=Math.ceil(peers.length/3);
  const diameter=Math.max(6,Math.min(17,(r.width-6)/3.5,(r.height-5)/2.8));
  const row=Math.floor(n/3),rowCount=Math.min(cols,peers.length-row*3),col=n%3;
  const x=r.left-lr.left+r.width/2+(col-(rowCount-1)/2)*(diameter+1);
  const y=r.bottom-lr.top-3-diameter/2-(rows-1-row)*(diameter+1);
  el.style.setProperty('--x',x+'px');el.style.setProperty('--y',y+'px');
  el.style.setProperty('--pawn-size',diameter+'px');el.style.setProperty('--pawn-font',Math.max(4,diameter*.56)+'px');
 }
}

function syncChatMode(){

function updateChat(){
 const key=S.chat.at(-1)?.id||'empty';if(key===lastChat)return;
 const initial=!lastChat;lastChat=key;const feed=$('#chatFeed');if(!feed)return;
 const near=feed.scrollHeight-feed.scrollTop-feed.clientHeight<90;
 feed.innerHTML=S.chat.length?S.chat.map(m=>{
  const st=G.STICKERS.find(x=>x.id===m.stickerId);
  return `<div class="chat-msg ${m.playerId===me?'mine':''}"><b>${esc(m.name)}${m.playerId===me?' · você':''}</b>${st?`<div class="sticker-message"><span>${st.emoji}</span><strong>${esc(st.label)}</strong></div>`:`<div>${esc(m.text)}</div>`}</div>`;
 }).join(''):'<div class="micro muted">Converse com a mesa e envie uma figurinha em 😊. Todo dinheiro é fictício.</div>';
 if(near||S.chat.at(-1)?.playerId===me)feed.scrollTop=feed.scrollHeight;
 for(const m of S.chat){
  if(seenReactions.has(m.id))continue;seenReactions.add(m.id);

function contractHTML(l){

 return `<article class="loan-card ${l.status==='overdue'?'overdue':''}"><div class="loan-card-head"><b>${esc(names)}</b><span class="pill">${l.status==='overdue'?'VENCIDO':mine?'A PAGAR':'A RECEBER'}</span></div><strong class="loan-balance">${money(l.balance)}</strong><p class="helper">Recebido: ${money(l.principal)} · Juros totais: ${l.rate}% · Total contratado: ${money(l.total)}.<br>${esc(due)}. Cobrança no início da vez de ${esc(payer.name)}.<br>Garantia: ${l.collateralId!=null?esc(G.TILES[l.collateralId].name):'sem imóvel específico; o patrimônio responde pela dívida'}.</p>${mine?`<button class="btn ${remaining>0?'primary':'ghost'} full" data-fin="repay" data-loan="${l.id}" data-amount="${remaining}" ${remaining<=0||!financeStateEnabled()?'disabled':''}>${remaining===l.balance?'Quitar':'Amortizar'} ${money(remaining)}</button>`:''}${S.debt?.loanId===l.id?'<button class="btn accent full finance-gap" data-ui="debtAssets">Resolver com imóvel</button>':''}</article>`;

 body+='<p class="helper">Empréstimos a pagar são descontados do patrimônio; créditos a receber são somados. Todos os valores são fictícios, exclusivos desta partida.</p>';

function paintDebtAssets(){
 const d=S.debt;if(!d){modal={type:'finance'};paintFinance();return;}
 const debtor=G.player(S,d.playerId),isBorrower=me===d.playerId,isLender=d.loanId&&me===d.creditorId;
 if(!isBorrower&&!isLender){toast('Essa cobrança não pertence a você.',true);modal={type:'finance'};paintFinance();return;}
 const loan=d.loanId?S.loans.find(l=>l.id===d.loanId):null;
 const assets=G.owned(S,d.playerId).filter(t=>G.transferableForDebt(S,t.id));
 const priority=loan?.collateralId!=null&&S.properties[loan.collateralId]?.owner===d.playerId?loan.collateralId:null;
 let body=`<div class="finance-warning"><b>${esc(debtor.name)} deve ${money(d.amount)}</b><p class="helper">${esc(d.reason)}. Avaliação: preço original + custo integral das construções − principal da hipoteca.</p></div>`;
 if(S.assetOffer)body+='<button class="btn accent full finance-gap" data-ui="assetReview">Ver proposta pendente</button>';
 for(const t of assets){const q=G.debtAssetQuote(S,t.id),lockedPriority=isLender&&priority!=null&&priority!==t.id;body+=`<article class="loan-card"><div class="loan-card-head"><b>${esc(t.name)}</b><span class="pill">${priority===t.id?'GARANTIA':'IMÓVEL'}</span></div><p class="helper">Avaliado em <b>${money(q.value)}</b>.<br>Abate: ${money(q.deduction)} · Troco para o devedor: ${money(q.change)}.</p><div class="finance-menu">${isBorrower?`<button class="btn primary" data-fin="assetOffer" data-tid="${t.id}" ${S.assetOffer?'disabled':''}>${d.creditorId?'Oferecer ao credor':'Entregar ao banco'}</button><button class="btn ghost" data-fin="assetLiquidate" data-tid="${t.id}">Liquidar no banco</button>`:`<button class="btn primary" data-fin="assetForeclose" data-tid="${t.id}" ${lockedPriority||q.change>G.spendable(S,me)?'disabled':''}>Tomar imóvel e pagar troco</button><button class="btn ghost" data-fin="assetForecloseBank" data-tid="${t.id}" ${lockedPriority?'disabled':''}>Liquidar no banco e receber</button>`}</div>${lockedPriority?'<p class="helper">O imóvel em garantia tem prioridade nesta cobrança.</p>':''}</article>`;}
 if(!assets.length)body+='<p class="bodycopy">Nenhum imóvel livre para esta dívida. Garantias de outros contratos não podem ser utilizadas aqui. Consulte o banco ou declare falência se não houver como pagar.</p>';
 body+='<p class="helper">Na liquidação, o banco recebe o imóvel sem construções, paga a parcela da dívida e devolve o excedente ao devedor. Uma proposta voluntária para outro jogador precisa ser aceita. Execução forçada só existe para empréstimo vencido.</p>';
 modalShell(isBorrower?'Pagar dívida com imóveis':'Executar empréstimo vencido',body,'VALORES E TRANSFERÊNCIAS AUTOMÁTICOS');
}
let pendingFinanceAction=null;

async function financeClick(button){
 const fin=button.dataset.fin;
 if(fin==='repay'){
  const l=S.loans.find(l=>l.id===button.dataset.loan),v=Number(button.dataset.amount);
  confirmFinanceAction({type:'loanPay',loanId:l.id,amount:v},'Confirmar pagamento',`Pagar <b>${money(v)}</b> de ${money(l.balance)}. Restarão ${money(l.balance-v)} neste contrato. O prazo e os juros contratados não serão alterados.`);return;
 }
 if(['assetOffer','assetLiquidate','assetForeclose','assetForecloseBank'].includes(fin)){
  const tid=Number(button.dataset.tid),q=G.debtAssetQuote(S,tid),isBank=['assetLiquidate','assetForecloseBank'].includes(fin)||!S.debt.creditorId;
  const action=fin==='assetOffer'?{type:'offerAsset',tileId:tid}:fin==='assetLiquidate'?{type:'liquidateDebt',tileId:tid}:{type:'foreclose',tileId:tid,toBank:isBank};
  const verb=fin==='assetOffer'&&q.creditorId?'Enviar a proposta de':'Confirmar a transferência de';
  confirmFinanceAction(action,'Pagamento com imóvel',`${verb} <b>${esc(G.TILES[tid].name)}</b>. Abate da dívida: <b>${money(q.deduction)}</b>. Troco ao devedor: <b>${money(q.change)}</b>. ${isBank?'O imóvel volta ao banco sem construções.':'O novo dono recebe as construções e eventuais obrigações de hipoteca.'}`);return;
 }
 const action=fin==='confirm'?pendingFinanceAction:fin==='loanAccept'?{type:'loanReply',accept:true}:fin==='loanReject'?{type:'loanReply',accept:false}:fin==='assetAccept'?{type:'assetReply',accept:true}:fin==='assetReject'?{type:'assetReply',accept:false}:null;
 if(!action||actionPending)return;
 actionPending=true;button.disabled=true;
 try{await act(action);pendingFinanceAction=null;modal={type:'finance'};paintFinance();}catch{}finally{actionPending=false;if(button.isConnected)button.disabled=false;}
}
async function ui(name){

}
function exit(){
 if(S&&S.phase!=='finished'){modal={type:'exit'};modalShell('Sair e retomar depois?',`<p class="bodycopy">${net?.mode==='local'?'A demonstração não tem salvamento online.':net?.isHost?'A partida ficará pausada para o retorno. O patrimônio está salvo no servidor. Volte com o mesmo código e nome; o anfitrião não funciona como servidor.':'Seu patrimônio, posição e empréstimos permanecem salvos no servidor. Volte com o mesmo código e nome. Sua saída não é uma falência.'}</p><div class="deed-actions"><button class="btn primary" data-ui="confirmExit">Sair agora</button><button class="btn ghost" data-ui="close">Continuar na partida</button></div>`);return;}confirmExit();
}
function rules(){
 modal={type:'rules'};
 const sections=[
 ['Objetivo e moeda','Compre ruas brasileiras, receba aluguéis e construa hotéis. Todo dinheiro é fictício, exibido em reais. Cada novo participante recebe R$ 25.000.000. Ao completar uma volta pelo Início, recebe R$ 2.000.000. Os preços são valores de jogo, não cotações imobiliárias.'],
 ['Entrar, perder a internet e retornar','Abra o mesmo endereço do jogo, informe o código de seis caracteres e o mesmo nome. Maiúsculas e minúsculas não criam outro jogador. Um participante desconectado volta com saldo, terrenos, construções, posição, autorizações e contratos. Entradas com outro nome são novos participantes, quando houver vaga; podem ocorrer durante a partida. Jogadores retirados pelo anfitrião não podem retornar com o nome retirado; falidos não recebem um novo capital e continuam apenas como espectadores.'],
 ['Salvamento e pausas','O servidor confirma cada transação antes de responder. Uma ausência é detectada em até 60 segundos; a partida e os relógios passam a aguardar o retorno. Guardar dinheiro, imóveis e contratos não depende do navegador do anfitrião. A sala expira após 30 dias sem atividade. O site pode ficar indisponível quando a cota gratuita da hospedagem acabar.'],
 ['Código e nome não são senha','Use o código somente em um grupo privado de colegas. A identidade salva no navegador permite retorno imediato na mesma sessão. Em outro aparelho, código e nome recuperam um participante offline depois de liberada a conexão anterior, em até 60 segundos. Essa conveniência não é autenticação forte: quem conhece o código e o nome pode assumir uma identidade offline. Não use para dinheiro real ou competições públicas.'],
 ['Turnos, dados e compra','Na sua vez lance dois dados e avance a soma. Resolva a casa, faça suas operações e encerre o turno. Dados iguais dão outra jogada; três duplas consecutivas levam à Auditoria. Um terreno livre pode ser comprado pelo preço da escritura ou enviado a leilão. Imóvel alheio cobra aluguel automaticamente. A Praça Livre não paga prêmio. Sorte ou Revés, impostos e recebimentos são resolvidos pelo sistema.'],
 ['Casas e hotéis sem completar cores','O proprietário pode construir a qualquer momento da partida, inclusive fora da sua vez, pela carteira. Não precisa estar sobre o terreno nem completar o grupo. A sequência é terreno → 1 casa → 2 → 3 → 4 → hotel na quinta etapa. São quatro casas substituídas por um hotel, não cinco casas mais um hotel. Companhias não recebem construções. É necessário saldo livre, terreno sem hipoteca e ausência de dívida pendente. Empréstimos em dia não bloqueiam construção. Novas construções não aumentam retroativamente um aluguel já calculado.'],
 ['Companhias brasileiras','Metrô de São Paulo, Rumo, Correios, Azul, Sabesp e Cemig são companhias temáticas. A cobrança é tarifa da escritura × soma dos dois dados, e não porcentagem. Exemplo: R$ 40.000 × 6 pontos = R$ 240.000 ao proprietário. Não há bônus por possuir outras companhias. Nomes são usados como ambientação independente, sem patrocínio.'],
 ['Auditoria e autorização','Chegar à Auditoria por movimento normal é apenas visita. Quando enviado, tente dados iguais em três jogadas ou use uma autorização de saída. Sem conseguir, na quarta jogada paga R$ 500.000 e avança os pontos sorteados. A falta de saldo abre uma dívida; depois de resolvida, o deslocamento continua. Ir direto à Auditoria não paga o bônus do Início.'],
 ['Leilões, trocas e hipotecas','Leilão mínimo de R$ 200.000, com aumentos mínimos de R$ 100.000. São 25 segundos iniciais, e cada lance garante ao menos 8 segundos restantes. Quem passa não volta ao leilão. Trocas requerem aceite da outra parte e têm 60 segundos. Hipoteca paga metade do preço do terreno; resgate custa o principal mais 20%. O imóvel hipotecado não cobra aluguel. Na sua vez, venda construções pela metade do custo antes de hipotecar aquele terreno. Imóveis dados em garantia de empréstimo não podem ser hipotecados ou negociados.'],
 ['Pagar dívida com um imóvel','Durante uma dívida pendente, selecione Pagar com imóvel. A avaliação é o preço original + custo integral das construções − principal de eventual hipoteca. Para outro jogador, uma proposta voluntária requer o aceite do credor. O imóvel vai com as construções e a hipoteca. O valor abate a dívida; se sobrar, o credor paga o troco ao devedor. Se não puder pagar o troco, a liquidação no banco é alternativa: o banco recebe o imóvel sem construções, paga ao credor e devolve o excedente ao devedor. Um imóvel que garante outro contrato não pode quitar esta dívida.'],
 ['Empréstimo do banco','No painel Banco & contratos, solicite de R$ 100.000 a R$ 5.000.000. Os juros são fixos de 10% para todo o empréstimo, e o prazo é de 3 rodadas. Exemplo: R$ 1.000.000 recebido na rodada 2 exige R$ 1.100.000 no início da sua vez na rodada 5. Só pode haver um empréstimo do banco por pessoa. A garantia específica é opcional, mas o patrimônio responde pela dívida mesmo sem ela. Não é permitido novo crédito se houver contrato vencido.'],
 ['Empréstimos entre jogadores','É possível pedir ou oferecer dinheiro. A proposta informa credor, devedor, principal, juros totais de 0% a 50%, prazo de 1 a 10 rodadas e eventual imóvel em garantia. O outro participante precisa aceitar. Sem aceite, nada é transferido. No aceite, o dinheiro sai do credor, entra no devedor e o contrato é registrado para toda a sala. O prazo começa na rodada do aceite. Uma pessoa pode ter até 3 contratos em aberto, incluindo o do banco. O credor precisa de saldo livre e não pode estar com dívida pendente.'],
 ['Garantias e pagamento antecipado','Um mesmo imóvel só pode garantir um empréstimo. Enquanto estiver em garantia, não pode ser transferido, hipotecado nem ter construções vendidas, mas pode receber mais casas e continuar cobrando aluguel. O contrato pode ser quitado ou amortizado antes do vencimento pelo painel. Os juros fixos já contratados não são recalculados. Quitado, a garantia é liberada automaticamente.'],
 ['Vencimento e tomada de imóvel','O vencimento acontece no início da vez do devedor na rodada indicada, não durante uma queda de internet. O sistema usa primeiro o dinheiro disponível. Empréstimos do banco sem pagamento integral liquidam automaticamente a garantia ou outros imóveis, devolvendo excedente ao devedor. Entre jogadores, o credor pode executar a garantia e depois outros imóveis livres. Para ficar com um imóvel de valor maior que a dívida, deve pagar o troco; alternativamente, pode liquidá-lo no banco e receber em dinheiro. Não pode tomar imóvel antes do vencimento, por uma dívida já paga ou pertencente a outra pessoa. Um imóvel de valor menor abate apenas sua avaliação, e o restante segue devido.'],
 ['Falência e ordem das dívidas','Se um empréstimo vencer e o devedor não tiver dinheiro nem imóveis, a falência é automática. Com bens, mas sem meios suficientes para quitar tudo, ele também pode declarar falência. Na liquidação, as garantias pagam primeiro seus respectivos contratos; depois vêm a dívida que bloqueia o turno e os demais contratos em ordem de criação. O que não for recuperado é registrado como perda do credor, e não cria saldo negativo. Empréstimos em que o jogador falido era o credor passam a ter o banco como credor. A conexão cair, por si só, nunca provoca falência.'],
 ['Poderes do anfitrião','O anfitrião pode retirar um participante, conectado ou não, com confirmação. Retirada é definitiva para esse nome na partida e não deve ser confundida com queda de conexão. Os bens são liquidados para as dívidas existentes, e os imóveis retornam ao banco. Turnos e contratos são ajustados. Não use Retirar para consertar uma queda de internet: aguarde a reconexão.'],
 ['Vitória e patrimônio','No tradicional, vence o último jogador solvente. No modo rápido, vence o maior patrimônio no limite de rodadas. Patrimônio = dinheiro + avaliação dos imóveis + contratos a receber − contratos a pagar − outras dívidas pendentes. Uma dívida vencida de empréstimo não é descontada duas vezes. Em empate, a vitória é compartilhada.']
 ];
 let body='<div class="rules-body"><div class="rule-call"><b>Metrópole — Brasil Milionário 4.0</b><br>Reconexão com patrimônio, dívidas em imóveis e contratos com prazo. Regras próprias desta adaptação. Não é um produto oficial da Estrela.</div>'+sections.map(([title,text],i)=>`<section class="rule-section"><span class="rule-number">${String(i+1).padStart(2,'0')}</span><h2>${esc(title)}</h2><p>${esc(text)}</p></section>`).join('');
 body+='<h2>Escrituras e valores</h2><div class="rule-table-wrap"><table class="rule-table"><thead><tr><th>Imóvel</th><th>Compra</th><th>Construção / tarifa</th><th>Aluguel vazio</th><th>Hotel</th></tr></thead><tbody>'+G.TILES.filter(t=>t.price).map(t=>`<tr><td>${esc(t.name)}</td><td>${money(t.price)}</td><td>${money(t.group?G.GROUPS[t.group].build:t.rate)}</td><td>${t.rents?money(t.rents[0]):'Tarifa × dados'}</td><td>${t.rents?money(t.rents[G.HOTEL_LEVEL]):'Não se aplica'}</td></tr>`).join('')+'</tbody></table></div><p class="small">Esta edição conecta cada participante ao servidor por HTTPS, sem PeerJS ou WebRTC. Requisições periódicas sincronizam a sala. Repetir uma requisição não repete a cobrança. A hospedagem gratuita tem limite de uso; não há assinatura ou cobrança contratada pelo jogo. Salas 3.1 não são importadas automaticamente; comece uma nova sala 4.0.</p></div>';
 modalShell('Regras completas',body,'BRASIL MILIONÁRIO · 4.0');
}
window.addEventListener('metro-notice',e=>toast(String(e.detail),true));
document.addEventListener('click',async e=>{const button=e.target.closest('[data-fin]');if(!button||button.disabled)return;try{await financeClick(button);}catch(e){toast(e.message,true);}});
document.addEventListener('input',e=>{if(['loanAmount','loanRate','loanTerm'].includes(e.target.id))updateLoanQuote();});
document.addEventListener('change',e=>{if(e.target.id==='loanPartner'){refreshLoanCollateral();updateLoanQuote();}});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='loanForm')return;e.preventDefault();if(actionPending)return;
 const kind=e.target.dataset.kind,parties=loanParties(),amount=Number($('#loanAmount').value),collateralId=$('#loanCollateral').value===''?null:Number($('#loanCollateral').value);
 if(!$('#loanConsent').checked)return;
 const action=kind==='bank'?{type:'bankLoan',amount,collateralId}:{type:'loanOffer',...parties,amount,rate:Number($('#loanRate').value),term:Number($('#loanTerm').value),collateralId};
 const button=e.target.querySelector('[type="submit"]');button.disabled=true;actionPending=true;
 try{await act(action);modal={type:kind==='bank'?'finance':'loanReview'};kind==='bank'?paintFinance():paintLoanReview();}catch{}finally{actionPending=false;if(button.isConnected)button.disabled=false;}
});

home();
})();

</script></body></html>
